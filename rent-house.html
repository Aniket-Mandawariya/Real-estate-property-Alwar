<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent House</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>

<nav>
    <h2 class="logo">DreamEstate</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>

<section class="page-hero small-hero">
    <h1>Available Lands</h1>
</section>

<section class="grid-section">

        <div class="property-item" onclick="openModal('Rent house')">
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef">
            <h3>Rent house</h3>
            <p>$20,000</p>
        </div>

        <div class="property-item" onclick="openModal('Rent floor')">
            <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
            <h3>Rent floor</h3>
            <p>$35,000</p>
        </div>

        <div class="property-item" onclick="openModal('Rent store')">
            <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef">
            <h3>Rent store</h3>
            <p>$15,000</p>
        </div>

    </div>
</section>

    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3>Contact Options</h3>

        <button class="contact-btn">Contact</button>

        <div class="contact-info" id="contactInfo">
            📞 +91 7891441441 <br>

        </div>
